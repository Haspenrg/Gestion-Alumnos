<!doctype html>
<html lang="es">
  <head>
    <!-- Parche para el Icono de la Pestaña (Favicon) -->
    <link rel="icon" type="image/png" href="logo1.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso - Colegio HASPEN</title>
    <link rel="stylesheet" href="estilos.css" />
    <style>
      /* Estilos de consistency para el enlace de recuperación de contraseña */
      .forgot-pass {
        display: block;
        margin-top: 15px;
        color: #1a73e8;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
      }
      .forgot-pass:hover {
        text-decoration: underline;
      }
      .mensaje-alerta {
        margin: 10px 0;
        padding: 8px 12px;
        background-color: #fff7ed;
        border-radius: 4px;
        font-size: 13px;
        font-weight: 500;
        text-align: center;
      }

      /* PARCHE: Posicionamiento y diseño para el botón visor de contraseña */
      .password-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }
      .password-wrapper input {
        width: 100%;
        padding-right: 40px !important; /* Evita que el texto se superponga con el ojo */
      }
      .toggle-password-btn {
        position: absolute;
        right: 12px;
        background: none;
        border: none;
        cursor: pointer;
        font-size: 18px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #64748b;
        user-select: none;
      }
      .toggle-password-btn:hover {
        color: #1e293b;
      }
    </style>
  </head>
  <body>
    <!-- TARJETA UNIFICADA CON EL NUEVO ESCUDO TRANSPARENTE -->
    <div class="login-container">
      <!-- MITAD SUPERIOR: CABECERA AZUL CON EL ESCUDO CIRCULAR LOGO1 -->
      <div class="login-header">
        <img src="logo1.png" alt="Escudo Oficial Colegio HASPEN" class="logo-colegio" />
      </div>

      <!-- MITAD INFERIOR: FORMULARIO EN CUERPO BLANCO -->
      <div class="login-body">
        <form id="loginForm" novalidate>
          <h2 class="titulo-principal">Sistema de Gestión de Alumnos</h2>
          <h3>Colegio Haspen</h3>
          <p>Inicie sesión para continuar</p>

          <div id="mensaje" class="mensaje-alerta"></div>

          <div class="input-group">
            <label for="usuario">Usuario (DNI)</label>
            <input type="text" id="usuario" placeholder="Ej: 22222222" required pattern="[0-9]+" inputmode="numeric" />
          </div>

          <div class="input-group">
            <label for="password">Contraseña</label>
            <div class="password-wrapper">
              <input type="password" id="password" placeholder="••••••••" required />
              <button
                type="button"
                id="togglePassword"
                class="toggle-password-btn"
                title="Mostrar/Ocultar contraseña"
                aria-label="Mostrar u ocultar contraseña"
              >
                👁️
              </button>
            </div>
          </div>

          <button type="submit" class="btn-principal">Ingresar al Sistema</button>
          <a href="#" id="olvido-pass" class="forgot-pass">¿Olvidaste tu contraseña?</a>
        </form>
      </div>
    </div>
    <!-- VENTANA MODAL DE RECUPERACIÓN POR DNI -->
    <div id="modalRecuperar" class="modal-contenedor">
      <div class="modal-contenido">
        <h3>Recuperar Credenciales</h3>
        <p>Ingrese su número de DNI para recibir el enlace de restablecimiento en su correo real registrado.</p>
        <div id="modal-mensaje" class="mensaje-alerta"></div>
        <div class="input-group">
          <label for="modal-dni">Su número de DNI</label>
          <input type="text" id="modal-dni" placeholder="Ej: 11111111" pattern="[0-9]+" inputmode="numeric" />
        </div>
        <div class="modal-botones">
          <button type="button" id="btn-cancelar-modal" class="btn-secundario">Cerrar</button>
          <button type="button" id="btn-consultar-modal" class="btn-principal">Verificar DNI</button>
        </div>
      </div>
    </div>

    <!-- CONEXIÓN DEL SCRIPT PRINCIPAL INDEPENDIENTE -->
    <script type="module" src="index.js"></script>

    <!-- Script independiente para el visor de contraseña y manejo de URL -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var parametrosUrl = new URLSearchParams(window.location.search);
        if (parametrosUrl.get("motivo") === "inactividad") {
          var contenedorMensaje = document.getElementById("mensaje");
          if (contenedorMensaje) {
            contenedorMensaje.textContent = "Su sesión ha caducado por inactividad. Por favor, ingrese nuevamente.";
            contenedorMensaje.style.color = "#d97706";
          }
        }

        var botonOjo = document.getElementById("togglePassword");
        var campoClave = document.getElementById("password");

        if (botonOjo && campoClave) {
          botonOjo.addEventListener("click", function (evento) {
            // Evita que el formulario intente enviarse al hacer clic
            evento.preventDefault();
            evento.stopPropagation();

            if (campoClave.type === "password") {
              campoClave.type = "text";
              botonOjo.textContent = "🙈";
            } else {
              campoClave.type = "password";
              botonOjo.textContent = "👁️";
            }
          });
        }
      });
    </script>
  </body>
</html>
