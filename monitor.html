<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monitor de Auditoría - Colegio Haspen</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #1e293b;
        color: #ffffff;
        font-family: monospace;
        font-size: 12px;
        user-select: none;
        overflow: hidden; /* Bloquea por completo cualquier scroll */
      }
      .header {
        background-color: #0f172a;
        padding: 10px 12px;
        font-weight: bold;
        color: #38bdf8;
        font-size: 11px;
        letter-spacing: 0.5px;
        border-bottom: 1px solid #334155;
        text-transform: uppercase;
      }
      .contenido {
        padding: 10px 12px;
      }
      .grid-metricas {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 8px;
      }
      .tarjeta {
        background-color: #0f172a;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 8px 10px;
      }
      .tarjeta-titulo {
        font-size: 10px;
        color: #94a3b8;
        margin-bottom: 2px;
        text-transform: uppercase;
      }
      .valor {
        font-size: 16px;
        font-weight: bold;
      }
      .local {
        color: #4ade80;
      }
      .firebase {
        color: #f87171;
      }

      .panel-control {
        display: flex;
        flex-direction: column;
        gap: 6px;
        background-color: #0f172a;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 10px;
      }
      .btn-actualizar {
        background-color: #0284c7;
        color: #ffffff;
        border: none;
        border-radius: 4px;
        padding: 6px 10px;
        font-family: monospace;
        font-weight: bold;
        cursor: pointer;
        text-transform: uppercase;
      }
      .btn-actualizar:hover {
        background-color: #0369a1;
      }
      .btn-actualizar:disabled {
        background-color: #334155;
        color: #94a3b8;
        cursor: not-allowed;
      }
      .detalle {
        font-size: 10px;
        color: #94a3b8;
        font-style: italic;
        line-height: 1.2;
        border-bottom: 1px solid #334155;
        padding-bottom: 4px;
        margin-bottom: 2px;
      }
      .reinicio-info {
        font-size: 9px;
        color: #38bdf8;
        font-weight: bold;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <div class="header">📊 Monitor de Auditoría Global</div>

    <div class="contenido">
      <!-- Panel de las 4 Variables Clave -->
      <div class="grid-metricas">
        <div class="tarjeta">
          <div class="tarjeta-titulo">💻 Lecturas Local</div>
          <div id="metrica-local-lecturas" class="valor local">0</div>
        </div>
        <div class="tarjeta">
          <div class="tarjeta-titulo">💾 Escrituras Local</div>
          <div id="metrica-local-escrituras" class="valor local">0</div>
        </div>
        <div class="tarjeta">
          <div class="tarjeta-titulo">🔥 Lecturas Firebase</div>
          <div id="metrica-firebase-lecturas" class="valor firebase">0</div>
        </div>
        <div class="tarjeta">
          <div class="tarjeta-titulo">✍️ Escrituras Firebase</div>
          <div id="metrica-firebase-escrituras" class="valor firebase">0</div>
        </div>
      </div>

      <!-- Panel de Control Pasivo -->
      <div class="panel-control">
        <button id="btn-actualizar-metrics" class="btn-actualizar">🔄 Actualizar Métricas</button>
        <div id="txt-estado-monitor" class="detalle">Estado: Ventana congelada de forma pasiva.</div>
        <div class="reinicio-info">⏰ Reinicio del contador: 21:00 hs Local</div>
      </div>
    </div>

    <!-- Vinculación del script del módulo -->
    <script type="module" src="monitor.js"></script>
  </body>
</html>
